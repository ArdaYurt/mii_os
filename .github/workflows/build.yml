name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MII_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mii.jks"
          echo "MII_KEYSTORE_PATH=$RUNNER_TEMP/mii.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MII_KEYSTORE_PASSWORD: ${{ secrets.MII_KEYSTORE_PASSWORD }}
          MII_KEY_ALIAS: ${{ secrets.MII_KEY_ALIAS }}
          MII_KEY_PASSWORD: ${{ secrets.MII_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk mii-os.apk

      # Surface compiler and Gradle errors as annotations so they show on the PR's checks.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |^\* What went wrong|^> |error:" -A2 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=Build errors::/'
          echo

      - uses: actions/upload-artifact@v4
        with:
          name: mii-os-apk
          path: mii-os.apk

      # Every push to main replaces the "latest" release, so the TV can always
      # download the newest build from the same short link.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mii-os.apk --title "Mii_OS latest build" --notes "Built from ${GITHUB_SHA::7}." --prerelease=false
